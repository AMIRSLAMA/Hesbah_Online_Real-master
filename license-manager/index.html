<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hesbah License Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0b1220;color:#e5e7eb}
header{padding:22px 28px;background:linear-gradient(135deg,#111c33,#172554);border-bottom:1px solid #26344f}
h1{margin:0 0 6px;font-size:28px}header p{margin:0;color:#9fb0c9}
main{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;padding:22px;max-width:1200px;margin:auto}
.card{background:#111827;border:1px solid #25324a;border-radius:16px;padding:20px;box-shadow:0 12px 35px rgba(0,0,0,.2)}
h2{margin-top:0;font-size:19px}.status{padding:12px;border-radius:10px;margin-bottom:16px;background:#1f2937}.ok{border:1px solid #166534;background:#052e16;color:#bbf7d0}.bad{border:1px solid #991b1b;background:#450a0a;color:#fecaca}
label{display:block;margin:14px 0 7px;color:#cbd5e1}input,textarea,button{font:inherit}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #34445f;background:#0b1220;color:#fff;outline:none}
input:focus{border-color:#60a5fa}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700}.primary{background:#2563eb;color:#fff}.secondary{background:#334155;color:#fff}.copy{background:#059669;color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.muted{color:#94a3b8;font-size:13px}
textarea{width:100%;min-height:150px;resize:vertical;padding:12px;border-radius:10px;border:1px solid #34445f;background:#07101f;color:#d1fae5;direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #26344a;text-align:right;vertical-align:top}th{color:#93c5fd}.empty{padding:20px;text-align:center;color:#94a3b8}
@media(max-width:900px){main{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>🔐 Hesbah License Manager</h1><p>برنامج الإدارة لإصدار تراخيص Hesbah وربطها بجهاز العميل</p></header>
<main>
<section class="card">
<h2>🔑 مفتاح الترخيص</h2>
<div id="keyStatus" class="status">جاري التحقق...</div>
<p class="muted">المفتاح الخاص لا يتم رفعه إلى GitHub. يتم حفظ نسخة محلية في بيانات برنامج الإدارة.</p>
<div class="actions"><button class="secondary" onclick="importKey()">استيراد private-key.pem</button></div>
<h2 style="margin-top:28px">🧾 إصدار ترخيص جديد</h2>
<label>اسم العميل</label><input id="customer" placeholder="مثال: شركة النور">
<label>Machine ID</label><input id="machineId" placeholder="الصق Machine ID الخاص بالعميل">
<div class="row">
<div><label>مدة الترخيص بالأيام</label><input id="days" type="number" min="1" max="3650" value="365"></div>
<div><label>المدة السريعة</label><div class="actions" style="margin-top:0"><button class="secondary" onclick="setDays(30)">30</button><button class="secondary" onclick="setDays(90)">90</button><button class="secondary" onclick="setDays(365)">365</button></div></div>
</div>
<div class="actions"><button class="primary" onclick="generate()">🔐 إصدار كود التفعيل</button></div>
<div id="message" class="muted" style="margin-top:12px"></div>
</section>
<section class="card">
<h2>📋 كود التفعيل</h2>
<textarea id="code" readonly placeholder="سيظهر كود التفعيل هنا بعد الإصدار"></textarea>
<div class="actions"><button class="copy" onclick="copyCode()">📋 نسخ الكود</button><button class="secondary" onclick="clearCode()">مسح</button></div>
<p id="licenseInfo" class="muted"></p>
<h2 style="margin-top:28px">📚 سجل التراخيص</h2>
<div style="overflow:auto"><table><thead><tr><th>العميل</th><th>Machine ID</th><th>الإصدار</th><th>الانتهاء</th></tr></thead><tbody id="records"></tbody></table></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function setDays(n){$("days").value=n}
async function refresh(){
 const s=await window.licenseManager.getStatus(),box=$("keyStatus");
 if(s.valid){box.className="status ok";box.textContent="✅ مفتاح Hesbah الصحيح جاهز لإصدار التراخيص."}
 else if(s.configured){box.className="status bad";box.textContent="❌ المفتاح المحفوظ لا يطابق مفتاح Hesbah العام."}
 else{box.className="status bad";box.textContent="⚠️ لم يتم استيراد private-key.pem بعد."}
 render(s.records||[]);
}
async function importKey(){const r=await window.licenseManager.importPrivateKey();if(r.ok){$("message").textContent="✅ تم استيراد مفتاح Hesbah بنجاح.";await refresh()}else if(!r.canceled){$("message").textContent="❌ "+r.error}}
async function generate(){try{$("message").textContent="جاري إصدار الترخيص...";const r=await window.licenseManager.generate({customer:$("customer").value,machineId:$("machineId").value,days:$("days").value});$("code").value=r.code;$("licenseInfo").textContent="العميل: "+r.payload.customer+" — ينتهي: "+new Date(r.payload.expiresAt).toLocaleDateString("ar-EG");$("message").textContent="✅ تم إصدار الترخيص وحُفظ في السجل.";render(r.records||[])}catch(e){$("message").textContent="❌ "+e.message}}
async function copyCode(){const v=$("code").value;if(!v)return;await navigator.clipboard.writeText(v);$("message").textContent="✅ تم نسخ كود التفعيل."}
function clearCode(){$("code").value="";$("licenseInfo").textContent=""}
function render(rows){$("records").innerHTML=rows.length?rows.map(r=>"<tr><td>"+esc(r.customer)+"</td><td dir=ltr>"+esc(r.machineId)+"</td><td>"+esc(r.days)+" يوم</td><td>"+new Date(r.expiresAt).toLocaleDateString("ar-EG")+"</td></tr>").join(""):"<tr><td colspan=4 class=empty>لا توجد تراخيص صادرة حتى الآن</td></tr>"}
refresh();
</script>
</body></html>
