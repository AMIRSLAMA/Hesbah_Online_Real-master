<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>Hesbah | حسبة أونلاين</title>
<style>
:root{--bg:#07111f;--panel:rgba(255,255,255,.92);--text:#0f172a;--muted:#64748b;--primary:#2563eb;--primary2:#06b6d4;--success:#16a34a;--danger:#dc2626;--line:#e2e8f0;--shadow:0 24px 70px rgba(2,8,23,.22)}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,#164e63 0,#07111f 35%,#020617 100%);min-height:100vh}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 20%,rgba(37,99,235,.35),transparent 35%)}
.auth-card,.glass{background:var(--panel);border:1px solid rgba(255,255,255,.5);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.auth-card{width:min(440px,100%);padding:30px;border-radius:28px}.brand{text-align:center;font-size:36px;font-weight:900;color:#0f172a}.brand span{color:#2563eb}.subtitle{text-align:center;color:var(--muted);margin:8px 0 24px}.tabs{display:flex;gap:6px;padding:5px;background:#e2e8f0;border-radius:14px;margin-bottom:20px}.tab{flex:1;border:0;background:transparent;padding:12px;border-radius:10px;font-weight:800}.tab.active{background:#0f172a;color:#fff}.field{margin:0 0 14px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;border:1px solid #cbd5e1;background:#fff;padding:13px 14px;border-radius:12px;outline:0}.field input:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.1)}.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:900;transition:.2s}.btn:hover{transform:translateY(-1px)}.primary{color:#fff;background:linear-gradient(135deg,var(--primary),#4f46e5);box-shadow:0 12px 25px rgba(37,99,235,.25)}.success{color:#fff;background:linear-gradient(135deg,#16a34a,#059669)}.ghost{background:#fff;border:1px solid var(--line);color:#0f172a}.danger{color:#fff;background:#dc2626}.wide{width:100%}.msg{margin-top:12px;padding:10px;border-radius:10px;text-align:center;display:none}.msg.show{display:block}.msg.error{background:#fee2e2;color:#991b1b}.msg.ok{background:#dcfce7;color:#166534}
.app{min-height:100vh;background:linear-gradient(180deg,#eef6ff 0,#f8fafc 40%,#eef2ff 100%)}.top{position:sticky;top:0;z-index:30;background:rgba(7,17,31,.92);color:#fff;backdrop-filter:blur(16px);padding:13px 18px}.top-inner{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.top-brand{font-size:23px;font-weight:900}.top-brand span{color:#60a5fa}.user-actions{display:flex;align-items:center;gap:8px}.user-name{font-size:13px;color:#dbeafe}.container{max-width:1180px;margin:auto;padding:22px}.hero{border-radius:28px;padding:26px;background:linear-gradient(135deg,#0f172a,#1d4ed8 55%,#0891b2);color:#fff;box-shadow:0 25px 55px rgba(15,23,42,.2);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.1);left:-70px;top:-90px}.hero h1{margin:0 0 8px;font-size:28px;position:relative;z-index:1}.hero p{margin:0;color:#dbeafe;position:relative;z-index:1}.dashboard-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}.action-card{border:0;text-align:right;padding:22px;border-radius:22px;background:#fff;box-shadow:0 12px 35px rgba(15,23,42,.1);display:flex;align-items:center;gap:14px}.action-icon{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;font-size:28px;background:#dbeafe}.action-card h3{margin:0 0 5px}.action-card small{color:var(--muted)}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-head h2{margin:0}.orders-box{display:grid;gap:12px}.order-card{background:#fff;border-radius:20px;padding:17px;box-shadow:0 10px 28px rgba(15,23,42,.08);border:1px solid #e2e8f0}.order-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{padding:6px 10px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-weight:800;font-size:12px}.empty{text-align:center;color:var(--muted);padding:30px;background:#fff;border-radius:20px}
.order-page{display:none}.order-page.active{display:block}.order-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.order-toolbar h2{margin:0}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.product{background:#fff;border:1px solid #e2e8f0;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.08)}.product-img{height:155px;background:linear-gradient(135deg,#e0f2fe,#eef2ff);display:grid;place-items:center;overflow:hidden}.product-img img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:55px}.product-body{padding:15px}.product-name{font-size:18px;font-weight:900}.price{color:#2563eb;font-size:18px;font-weight:900;margin:7px 0}.unit{color:var(--muted);font-size:12px;margin-bottom:12px}.add{width:100%;border:0;color:#fff;background:linear-gradient(135deg,#2563eb,#06b6d4);padding:11px;border-radius:12px;font-weight:900}.add:disabled{background:#94a3b8}.cartbar{position:sticky;bottom:12px;z-index:20;margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:rgba(15,23,42,.94);color:#fff;box-shadow:0 15px 40px rgba(15,23,42,.25)}.cartbar .btn{padding:10px 15px}.cart-count{font-weight:900}.modal{position:fixed;inset:0;background:rgba(2,6,23,.65);z-index:100;display:grid;place-items:center;padding:15px}.modal-card{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{width:38px;height:38px;border:0;border-radius:50%;background:#e2e8f0;font-size:22px}.cart-item{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #e5e7eb}.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border:0;border-radius:8px;background:#e2e8f0;font-weight:900}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:900;padding:16px 0}.tracking{margin-top:15px;padding:16px;border-radius:18px;background:#f8fafc;border:1px solid #e2e8f0}.step{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:#e2e8f0;color:#64748b;margin:7px 0}.step.done{background:#dcfce7;color:#166534}.step.active{background:#dbeafe;color:#1d4ed8;font-weight:900}.map{height:260px;border-radius:14px;margin-top:12px;display:none;overflow:hidden}.footer{text-align:center;color:#64748b;padding:28px}.back-btn{min-width:95px}
@media(max-width:650px){.container{padding:13px}.dashboard-actions{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product-img{height:115px}.product-body{padding:10px}.product-name{font-size:15px}.price{font-size:15px}.top-inner{padding:0 2px}.user-name{display:none}.hero{padding:21px}.hero h1{font-size:23px}.action-card{padding:17px}.action-icon{width:48px;height:48px;font-size:23px}}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><style>
.chat-box{margin-top:14px;border:1px solid #dbe3ee;border-radius:18px;background:#fff;overflow:hidden;text-align:right;box-shadow:0 8px 24px rgba(15,23,42,.08)}
.chat-head{padding:13px 14px;background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:space-between}
.chat-messages{height:230px;overflow-y:auto;overflow-x:hidden;padding:12px;background:#f8fafc;display:flex;flex-direction:column;gap:9px}
.chat-msg{max-width:82%;padding:10px 12px;border-radius:16px;line-height:1.55;word-break:break-word}
.chat-msg.customer{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:5px}
.chat-msg.driver{align-self:flex-start;background:#fff;color:#0f172a;border:1px solid #dbe3ee;border-bottom-left-radius:5px}
.chat-msg small{display:block;opacity:.72;font-size:10px;margin-top:4px}
.chat-input{display:flex;flex-direction:row;align-items:center;gap:8px;padding:10px;background:#fff;border-top:1px solid #e2e8f0;direction:rtl}
.chat-input input{flex:1 1 auto;min-width:0;width:auto;border:1px solid #cbd5e1;border-radius:12px;padding:11px 12px;outline:0;height:44px}
.chat-input button{flex:0 0 78px;width:78px;height:44px;border:0;border-radius:12px;padding:0;background:#2563eb;color:#fff;font-weight:900}
@media(max-width:650px){
  .modal{padding:8px;align-items:flex-start}
  .modal-card{width:100%;max-height:calc(100dvh - 16px);margin:0;border-radius:18px;padding:14px;overflow-y:auto}
  .tracking{padding:12px}
  .chat-messages{height:180px}
  .chat-input{position:sticky;bottom:0}
  .chat-input input{font-size:15px}
  .chat-input button{flex-basis:72px;width:72px}
}
.map{height:280px;border-radius:14px;margin-top:12px;overflow:hidden;border:1px solid #e2e8f0}
</style></head>
<body>
<div id="authPage" class="auth">
  <div class="auth-card">
    <div class="brand">Hes<span>bah</span></div>
    <div class="subtitle">حساب العميل — اطلب وتابع طلبك بسهولة</div>
    <div class="tabs"><button id="loginTab" class="tab active" onclick="showLogin()">تسجيل الدخول</button><button id="registerTab" class="tab" onclick="showRegister()">حساب جديد</button></div>
    <div id="loginForm">
      <div class="field"><label>رقم الهاتف</label><input id="loginPhone" type="tel" placeholder="أدخل رقم الهاتف"></div>
      <div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" placeholder="أدخل كلمة المرور"></div>
      <button id="loginBtn" class="btn primary wide" onclick="loginCustomer()">تسجيل الدخول</button><div id="loginMessage" class="msg"></div>
    </div>
    <div id="registerForm" class="hidden">
      <div class="field"><label>الاسم</label><input id="registerName" placeholder="اسم العميل"></div>
      <div class="field"><label>رقم الهاتف</label><input id="registerPhone" type="tel" placeholder="رقم الهاتف"></div>
      <div class="field"><label>كلمة المرور</label><input id="registerPassword" type="password" placeholder="6 أحرف على الأقل"></div>
      <button id="registerBtn" class="btn primary wide" onclick="registerCustomer()">إنشاء الحساب</button><div id="registerMessage" class="msg"></div>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
<header class="top"><div class="top-inner"><div class="top-brand">Hes<span>bah</span></div><div class="user-actions"><span id="customerName" class="user-name"></span><button class="btn ghost" onclick="logoutCustomer()">خروج</button></div></div></header>
<main class="container">
  <section id="homePage">
    <div class="hero"><h1>أهلاً بك 👋</h1><p>مرحباً <strong id="welcomeName">بالعميل</strong> — اختر ما تريد واطلبه في دقائق.</p></div>
    <div class="dashboard-actions">
      <button class="action-card" onclick="startNewOrder()"><span class="action-icon">🛒</span><span><h3>تسجيل طلب جديد</h3><small>ابدأ اختيار المنتجات وأرسل طلبك</small></span></button>
      <button class="action-card" onclick="showLatestOrder()"><span class="action-icon">📦</span><span><h3>متابعة آخر طلب</h3><small>اعرف حالة الطلب والدليفري</small></span></button>
    </div>
    <section class="section"><div class="section-head"><h2>آخر طلب</h2></div><div id="latestOrder" class="orders-box"></div></section>
  </section>

  <section id="orderPage" class="order-page">
    <div class="order-toolbar"><button class="btn ghost back-btn" onclick="goHome()">← العودة</button><h2>🛍️ تسجيل طلب جديد</h2><span></span></div>
    <div id="products" class="products"><div class="empty">جاري تحميل المنتجات...</div></div>
    <div class="cartbar"><span>🛒 السلة: <span id="cartCount" class="cart-count">0</span></span><button class="btn primary" onclick="openCart()">فتح السلة</button></div>
  </section>
</main>
<footer class="footer">Hesbah Online</footer>
</div>

<div id="cartModal" class="modal hidden" onclick="if(event.target===this)closeCart()"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">سلة المشتريات</h2><button class="close" onclick="closeCart()">×</button></div><div id="cartItems"></div><div id="cartTotal" class="total"></div><button id="checkoutBtn" class="btn primary wide" onclick="checkout()">متابعة الطلب</button></div></div>

<script>
const STORE_ID='demo';
let customer=null,customerToken='',products=[],cart=[],trackingTimer=null,trackingMap=null,driverMarker=null,customerMarker=null,trackingLine=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
function msg(id,text,type='error'){const e=$(id);if(!e)return;e.textContent=text;e.className='msg show '+(type==='ok'?'ok':'error')}
function clearMsg(id){const e=$(id);if(e){e.textContent='';e.className='msg'}}
function showLogin(){$('loginForm').classList.remove('hidden');$('registerForm').classList.add('hidden');$('loginTab').classList.add('active');$('registerTab').classList.remove('active');clearMsg('loginMessage');clearMsg('registerMessage')}
function showRegister(){$('loginForm').classList.add('hidden');$('registerForm').classList.remove('hidden');$('loginTab').classList.remove('active');$('registerTab').classList.add('active');clearMsg('loginMessage');clearMsg('registerMessage')}
async function registerCustomer(){const name=$('registerName').value.trim(),phone=$('registerPhone').value.trim(),password=$('registerPassword').value;if(!name||!phone||!password)return msg('registerMessage','الاسم ورقم الهاتف وكلمة المرور مطلوبة');if(password.length<6)return msg('registerMessage','كلمة المرور يجب أن تكون 6 أحرف على الأقل');const b=$('registerBtn');b.disabled=true;b.textContent='جاري إنشاء الحساب...';try{const r=await fetch('/api/public/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({storeId:STORE_ID,name,phone,password})});const d=await r.json();if(!r.ok||!d.ok)return msg('registerMessage',d.message||'تعذر إنشاء الحساب');msg('registerMessage','تم إنشاء الحساب بنجاح. سجّل الدخول الآن.','ok');$('loginPhone').value=phone;$('registerPassword').value='';setTimeout(showLogin,700)}catch(e){console.error(e);msg('registerMessage','تعذر الاتصال بالسيرفر')}finally{b.disabled=false;b.textContent='إنشاء الحساب'}}
async function loginCustomer(){const phone=$('loginPhone').value.trim(),password=$('loginPassword').value;if(!phone||!password)return msg('loginMessage','أدخل رقم الهاتف وكلمة المرور');const b=$('loginBtn');b.disabled=true;b.textContent='جاري تسجيل الدخول...';try{const r=await fetch('/api/public/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({storeId:STORE_ID,phone,password})});const d=await r.json();if(!r.ok||!d.ok)return msg('loginMessage',d.message||'بيانات الدخول غير صحيحة');customerToken=d.token;customer=d.customer;localStorage.setItem('hesbah_customer_token',customerToken);localStorage.setItem('hesbah_customer',JSON.stringify(customer));openApp()}catch(e){console.error(e);msg('loginMessage','تعذر الاتصال بالسيرفر')}finally{b.disabled=false;b.textContent='تسجيل الدخول'}}
function openApp(){$('authPage').classList.add('hidden');$('app').classList.remove('hidden');$('customerName').textContent=customer?.name||'العميل';$('welcomeName').textContent=customer?.name||'بالعميل';renderLatestOrder();goHome()}
function goHome(){stopTracking();$('homePage').style.display='block';$('orderPage').classList.remove('active');$('orderPage').style.display='none';renderLatestOrder()}
function startNewOrder(){stopTracking();window.pendingOrderData=null;window.checkoutCustomerLocation=null;cart=[];const home=$('homePage'),page=$('orderPage');$('cartModal').classList.add('hidden');$('modalTitle').textContent='سلة المشتريات';$('cartItems').innerHTML='';$('cartTotal').innerHTML='';$('checkoutBtn').classList.remove('hidden');$('checkoutBtn').disabled=true;updateCart();home.style.display='none';page.style.display='block';page.classList.add('active');$('products').innerHTML='<div class="empty">جاري تحميل المنتجات...</div>';loadProducts();page.scrollIntoView({behavior:'smooth',block:'start'});}
async function loadProducts(){const box=$('products');box.innerHTML='<div class="empty">جاري تحميل المنتجات...</div>';try{const r=await fetch('/api/public/products?storeId='+encodeURIComponent(STORE_ID)+'&_='+Date.now(),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'تعذر تحميل المنتجات');products=Array.isArray(d.products)?d.products:[];renderProducts()}catch(e){console.error(e);box.innerHTML='<div class="empty">تعذر تحميل المنتجات. حاول مرة أخرى.</div>'}}
function renderProducts(){const box=$('products');if(!products.length){box.innerHTML='<div class="empty">لا توجد منتجات حالياً</div>';return}box.innerHTML=products.map(p=>{const ok=p.available===true;const stock=Math.max(0,Number(p.stock||0));return '<article class="product">'+(!ok?'<span class="badge" style="position:absolute;margin:10px">غير متاح</span>':'')+'<div class="product-img">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':'<div class="placeholder">📦</div>')+'</div><div class="product-body"><div class="product-name">'+esc(p.name)+'</div><div class="price">'+Number(p.price||0).toFixed(2)+' جنيه</div><div class="unit">'+esc(p.unit||'قطعة')+' • '+(ok?'متاح '+stock:'غير متاح')+'</div><button class="add" '+(!ok?'disabled':'')+' onclick="addToCart('+Number(p.id)+')">'+(ok?'إضافة للسلة':'غير متاح')+'</button></div></article>'}).join('')}
function addToCart(id){const p=products.find(x=>Number(x.id)===Number(id));if(!p||p.available!==true)return;const maxStock=Math.max(0,Number(p.stock||0));const x=cart.find(i=>Number(i.productId)===Number(id));if(x){if(Number(x.qty)>=maxStock)return alert('الكمية المتاحة من '+p.name+' هي '+maxStock);x.qty++;}else cart.push({productId:Number(p.id),code:String(p.code||''),name:p.name,price:Number(p.price||0),qty:1});updateCart();}
function updateCart(){$('cartCount').textContent=cart.reduce((a,x)=>a+Number(x.qty||0),0)}
function openCart(){renderCart();$('cartModal').classList.remove('hidden')}
function closeCart(){$('cartModal').classList.add('hidden')}
function renderCart(){if(!cart.length){$('cartItems').innerHTML='<div class="empty">السلة فارغة</div>';$('cartTotal').innerHTML='<span>الإجمالي</span><span>0.00 جنيه</span>';$('checkoutBtn').disabled=true;return}$('checkoutBtn').disabled=false;let total=0;$('cartItems').innerHTML=cart.map(i=>{const t=Number(i.price)*Number(i.qty);total+=t;return '<div class="cart-item"><div><b>'+esc(i.name)+'</b><div style="color:#2563eb;margin-top:4px">'+Number(i.price).toFixed(2)+' × '+i.qty+' = '+t.toFixed(2)+' جنيه</div></div><div class="qty"><button onclick="changeQty('+i.productId+',1)">+</button><b>'+i.qty+'</b><button onclick="changeQty('+i.productId+',-1)">−</button></div></div>'}).join('');$('cartTotal').innerHTML='<span>الإجمالي</span><span>'+total.toFixed(2)+' جنيه</span>'}
function changeQty(id,d){const x=cart.find(i=>Number(i.productId)===Number(id));if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(i=>Number(i.productId)!==Number(id));renderCart();updateCart()}
async function captureCustomerLocation(){if(!navigator.geolocation)return null;return await new Promise(resolve=>{navigator.geolocation.getCurrentPosition(p=>resolve({lat:Number(p.coords.latitude),lng:Number(p.coords.longitude),accuracy:Number(p.coords.accuracy||0)}),()=>resolve(null),{enableHighAccuracy:true,timeout:10000,maximumAge:30000})})}
async function checkout(){if(!cart.length)return alert('السلة فارغة');const address=customer?.address||'';const building=customer?.building||'';const floor=customer?.floor||'';const apartment=customer?.apartment||'';const location=await captureCustomerLocation();window.checkoutCustomerLocation=location;let total=cart.reduce((a,x)=>a+Number(x.price)*Number(x.qty),0);$('modalTitle').textContent='بيانات التوصيل';$('cartItems').innerHTML='<div class="field"><label>العنوان</label><input id="orderAddress" value="'+esc(address)+'" placeholder="العنوان بالتفصيل"></div><div class="field"><label>المبنى</label><input id="orderBuilding" value="'+esc(building)+'" placeholder="رقم المبنى"></div><div class="field"><label>الدور</label><input id="orderFloor" value="'+esc(floor)+'" placeholder="رقم الدور"></div><div class="field"><label>الشقة</label><input id="orderApartment" value="'+esc(apartment)+'" placeholder="رقم الشقة"></div><div class="field"><label>ملاحظات الطلب</label><input id="orderNotes" placeholder="أي ملاحظات إضافية"></div><div id="locationStatus" style="margin:10px 0;padding:12px;border-radius:12px;background:#eff6ff;color:#1d4ed8;font-weight:800">📍 جاري التحقق من موقعك...</div><div class="total"><span>الإجمالي</span><span>'+total.toFixed(2)+' جنيه</span></div><button class="btn primary wide" onclick="loadPaymentMethods()">متابعة واختيار طريقة الدفع</button>';const ls=$('locationStatus');if(ls)ls.textContent=location?'📍 تم تحديد موقعك تلقائياً وسيتم إرساله مع الطلب.':'📍 لم يتم تحديد الموقع تلقائياً. اسمح للموقع من المتصفح إذا أردت إرسال موقعك مع الطلب.';$('cartTotal').innerHTML='';$('checkoutBtn').classList.add('hidden')}
async function loadPaymentMethods(){const address=$('orderAddress').value.trim(),building=$('orderBuilding').value.trim(),floor=$('orderFloor').value.trim(),apartment=$('orderApartment').value.trim(),notes=$('orderNotes').value.trim();if(!address)return alert('من فضلك اكتب العنوان');try{const r=await fetch('/api/public/payment-methods?storeId='+encodeURIComponent(STORE_ID));const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'تعذر تحميل طرق الدفع');const p=d.payment||{},m=[];if(p.cash?.enabled)m.push({id:'cash',name:p.cash.name||'دفع كاش عند الاستلام'});for(const k of ['vodafoneCash','etisalatCash','orangeCash','wePay','instapay'])if(p[k]?.enabled)m.push({id:k,name:p[k].name||k,details:p[k].number||p[k].account||''});if(p.card?.enabled)m.push({id:'card',name:p.card.name||'Visa / Mastercard'});if(!m.length)return alert('لا توجد طرق دفع متاحة حالياً');window.pendingOrderData={address,building,floor,apartment,notes,location:window.checkoutCustomerLocation||null};$('modalTitle').textContent='اختيار طريقة الدفع';$('cartItems').innerHTML=m.map((x,i)=>'<label style="display:block;padding:14px;border:1px solid #e2e8f0;border-radius:14px;margin:9px 0;cursor:pointer"><input type="radio" name="payment" value="'+esc(x.id)+'" '+(i===0?'checked':'')+'> <b>'+esc(x.name)+'</b>'+(x.details?'<div style="color:#64748b;margin-top:5px">'+esc(x.details)+'</div>':'')+'</label>').join('')+'<button class="btn success wide" onclick="submitOrder()">تأكيد وإرسال الطلب</button>';$('cartTotal').innerHTML='';$('checkoutBtn').classList.add('hidden')}catch(e){console.error(e);alert('حدث خطأ أثناء تحميل طرق الدفع')}}
async function submitOrder(){const selected=document.querySelector('input[name="payment"]:checked');if(!selected)return alert('اختر طريقة الدفع');const d=window.pendingOrderData||{};const items=cart.map(x=>({productId:Number(x.productId),code:String(x.code||''),name:String(x.name||''),price:Number(x.price||0),qty:Number(x.qty||0)}));try{const r=await fetch('/api/public/orders',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+customerToken},body:JSON.stringify({storeId:STORE_ID,type:'delivery',customer:{name:customer.name||'',phone:customer.phone||'',address:d.address||'',building:d.building||'',floor:d.floor||'',apartment:d.apartment||'',notes:d.notes||''},customerLocation:d.location||null,items,paymentMethod:selected.value})});const x=await r.json();if(!r.ok||!x.ok)return alert(x.message||'تعذر إرسال الطلب');cart=[];updateCart();window.lastOnlineOrder={id:x.order.id,number:x.order.number,status:x.order.status||'new',total:x.order.total};localStorage.setItem('hesbah_last_online_order',JSON.stringify(window.lastOnlineOrder));renderOrderSuccess()}catch(e){console.error(e);alert('حدث خطأ أثناء إرسال الطلب')}}
function renderOrderSuccess(){openCart();$('modalTitle').textContent='تم إرسال الطلب بنجاح';$('cartItems').innerHTML='<div style="text-align:center;padding:12px"><div style="font-size:58px">✅</div><h2>طلبك وصل للمتجر</h2><p>رقم الطلب: <b>'+esc(window.lastOnlineOrder.number)+'</b></p><div class="tracking"><h3>حالة الطلب</h3><div id="statusText">جاري تحميل الحالة...</div><div id="steps"></div><div id="trackInfo" style="margin-top:10px;color:#64748b"></div>\n<div id="trackMap" class="map"></div>\n<div id="orderChat" class="chat-box">\n  <div class="chat-head">💬 شات مع المندوب</div>\n  <div id="orderChatMessages" class="chat-messages"><div class="empty" style="padding:20px">جاري تحميل المحادثة...</div></div>\n  <div class="chat-input">\n    <input id="orderChatInput" maxlength="1000" placeholder="اكتب رسالة للمندوب...">\n    <button id="orderChatSend" onclick="sendOrderChat()">إرسال</button>\n  </div>\n</div></div><button class="btn primary wide" style="margin-top:14px" onclick="startNewOrder();closeCart()">🛒 تسجيل طلب جديد</button><button class="btn ghost wide" style="margin-top:8px" onclick="closeCart();goHome()">← العودة</button></div>';$('cartTotal').innerHTML='';$('checkoutBtn').classList.add('hidden');startTracking()}
function statusLabel(s){return ({new:'تم استلام الطلب',accepted:'تم قبول الطلب',preparing:'جاري تجهيز الطلب',ready:'الطلب جاهز',out_for_delivery:'🛵 خرج الطلب للتوصيل',completed:'تم التسليم',rejected:'تم رفض الطلب'})[s]||s||'غير معروف'}
function renderSteps(s){const a=[['new','تم استلام الطلب'],['accepted','تم قبول الطلب'],['preparing','جاري التجهيز'],['ready','الطلب جاهز'],['out_for_delivery','🛵 خرج للتوصيل'],['completed','تم التسليم']];const ix=a.findIndex(x=>x[0]===s);return a.map((x,i)=>'<div class="step '+(i<ix?'done ':i===ix?'active':'')+'">'+(i<ix?'✅':i===ix?'🔵':'⚪')+' '+x[1]+'</div>').join('')}
function formatChatTime(v){try{return new Date(v).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function renderOrderChat(messages){
  const box=$('orderChatMessages');
  if(!box)return;
  if(!messages.length){box.innerHTML='<div class="empty" style="padding:20px">لا توجد رسائل بعد. يمكنك مراسلة المندوب هنا.</div>';return}
  box.innerHTML=messages.map(m=>'<div class="chat-msg '+(m.sender==='customer'?'customer':'driver')+'"><b>'+esc(m.sender==='customer'?'أنت':(m.senderName||'المندوب'))+'</b><div>'+esc(m.text)+'</div><small>'+esc(formatChatTime(m.createdAt))+'</small></div>').join('');
  box.scrollTop=box.scrollHeight;
}
async function refreshOrderChat(){
  if(!window.lastOnlineOrder||!customerToken||!$('orderChatMessages'))return;
  try{
    const r=await fetch('/api/public/orders/chat?storeId='+encodeURIComponent(STORE_ID)+'&orderId='+encodeURIComponent(window.lastOnlineOrder.id),{headers:{Authorization:'Bearer '+customerToken},cache:'no-store'});
    const d=await r.json();
    if(r.ok&&d.ok)renderOrderChat(Array.isArray(d.messages)?d.messages:[]);
  }catch(e){console.error('chat',e)}
}
async function sendOrderChat(){
  const input=$('orderChatInput'),btn=$('orderChatSend');
  if(!input||!customerToken||!window.lastOnlineOrder)return;
  const text=input.value.trim();
  if(!text)return;
  btn.disabled=true;
  try{
    const r=await fetch('/api/public/orders/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+customerToken},body:JSON.stringify({storeId:STORE_ID,orderId:Number(window.lastOnlineOrder.id),text})});
    const d=await r.json();
    if(!r.ok||!d.ok)throw Error(d.message||'تعذر إرسال الرسالة');
    input.value='';
    await refreshOrderChat();
  }catch(e){alert(e.message)}
  finally{btn.disabled=false;input.focus()}
}
function renderDriverMap(driverLocation,customerLocation){
  const el=$('trackMap');
  if(!el)return;
  if(!driverLocation){
    el.style.display='none';
    if(trackingMap){trackingMap.remove();trackingMap=null;driverMarker=null;customerMarker=null;trackingLine=null}
    return;
  }
  el.style.display='block';
  if(typeof L==='undefined'){
    el.innerHTML='<div style="padding:20px;text-align:center">📍 موقع المندوب: '+Number(driverLocation.lat).toFixed(6)+', '+Number(driverLocation.lng).toFixed(6)+'</div>';
    return;
  }
  const d=[Number(driverLocation.lat),Number(driverLocation.lng)];
  const customerPoint=customerLocation&&Number.isFinite(Number(customerLocation.lat))&&Number.isFinite(Number(customerLocation.lng))
    ? [Number(customerLocation.lat),Number(customerLocation.lng)] : null;
  if(!trackingMap){
    trackingMap=L.map(el,{zoomControl:true}).setView(d,15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(trackingMap);
    driverMarker=L.marker(d).addTo(trackingMap).bindPopup('🛵 موقع المندوب');
  }else{
    trackingMap.invalidateSize();
    driverMarker?driverMarker.setLatLng(d):driverMarker=L.marker(d).addTo(trackingMap).bindPopup('🛵 موقع المندوب');
  }
  if(customerPoint){
    if(!customerMarker)customerMarker=L.marker(customerPoint).addTo(trackingMap).bindPopup('📍 موقعك');
    else customerMarker.setLatLng(customerPoint);
    const pts=[d,customerPoint];
    if(trackingLine)trackingLine.setLatLngs(pts);
    else trackingLine=L.polyline(pts).addTo(trackingMap);
    trackingMap.fitBounds(L.latLngBounds(pts),{padding:[25,25],maxZoom:16});
  }else{
    trackingMap.setView(d,15);
  }
}
async function refreshTracking(){
  if(!window.lastOnlineOrder||!customerToken)return;
  const statusBox=$('statusText');
  try{
    const orderId=Number(window.lastOnlineOrder.id||0);
    if(!orderId)throw Error('رقم الطلب غير صالح');
    if(statusBox&&!statusBox.dataset.loaded){
      statusBox.innerHTML='<span style="color:#64748b">جاري الاتصال بالسيرفر...</span>';
    }
    const r=await fetch('/api/public/orders/status?storeId='+encodeURIComponent(STORE_ID)+'&orderId='+encodeURIComponent(orderId)+'&_='+Date.now(),{
      headers:{Authorization:'Bearer '+customerToken,'Cache-Control':'no-cache'},
      cache:'no-store'
    });
    let d=null;
    try{d=await r.json()}catch(e){d=null}
    if(!r.ok||!d?.ok){
      const message=d?.message||('تعذر تحديث حالة الطلب (HTTP '+r.status+')');
      if(statusBox)statusBox.innerHTML='<span style="color:#b91c1c">⚠️ '+esc(message)+'</span>';
      console.error('tracking api',r.status,d);
      await refreshOrderChat();
      return;
    }
    const o=d.order||{};
    statusBox.dataset.loaded='1';
    window.lastOnlineOrder={...window.lastOnlineOrder,...o};
    localStorage.setItem('hesbah_last_online_order',JSON.stringify(window.lastOnlineOrder));
    if(statusBox)statusBox.innerHTML='<b>'+esc(statusLabel(o.status))+'</b>'+(o.driverName?'<div style="margin-top:7px">🛵 المندوب: <b>'+esc(o.driverName)+'</b>'+(o.driverPhone?'<br>📞 '+esc(o.driverPhone):'')+'</div>':'');
    if($('steps'))$('steps').innerHTML=renderSteps(o.status);
    if($('trackInfo'))$('trackInfo').textContent=o.status==='out_for_delivery'?(o.driverLocation?'🟢 موقع الدليفري يتحرك الآن':'🟡 الطلب خرج للتوصيل'):o.status==='completed'?'✅ تم التسليم بنجاح':o.status==='rejected'?'❌ تم رفض الطلب':'سيتم تحديث الحالة تلقائياً.';
    renderDriverMap(o.driverLocation,o.customerLocation);
    await refreshOrderChat();
    if(o.status==='completed'||o.status==='rejected')stopTracking();
  }catch(e){
    console.error('tracking',e);
    if(statusBox)statusBox.innerHTML='<span style="color:#b91c1c">⚠️ تعذر تحديث حالة الطلب: '+esc(e.message||'خطأ غير معروف')+'</span>';
  }
}
function startTracking(){stopTracking();refreshTracking();trackingTimer=setInterval(refreshTracking,5000)}
function stopTracking(){if(trackingTimer){clearInterval(trackingTimer);trackingTimer=null}if(trackingMap){setTimeout(()=>{try{trackingMap.invalidateSize()}catch(e){}},50)}}

function showLatestOrder(){if(!window.lastOnlineOrder)return alert('لا يوجد طلب محفوظ للمشاهدة');openCart();renderOrderSuccess()}
function renderLatestOrder(){const box=$('latestOrder');const o=window.lastOnlineOrder;if(!o){box.innerHTML='<div class="empty">لا يوجد طلب حتى الآن.<br>اضغط على <b>تسجيل طلب جديد</b> للبدء.</div>';return}box.innerHTML='<div class="order-card"><div class="order-row"><div><b>'+esc(o.number||'طلب')+'</b><div style="color:#64748b;margin-top:5px">الإجمالي: '+Number(o.total||0).toFixed(2)+' جنيه</div></div><span class="badge">'+esc(statusLabel(o.status))+'</span></div><button class="btn primary wide" style="margin-top:12px" onclick="showLatestOrder()">متابعة الطلب</button></div>'}
function logoutCustomer(){stopTracking();customer=null;customerToken='';cart=[];localStorage.removeItem('hesbah_customer_token');localStorage.removeItem('hesbah_customer');localStorage.removeItem('hesbah_last_online_order');$('app').classList.add('hidden');$('authPage').classList.remove('hidden');showLogin()}
function restore(){try{const t=localStorage.getItem('hesbah_customer_token'),c=localStorage.getItem('hesbah_customer'),o=localStorage.getItem('hesbah_last_online_order');if(t&&c){customerToken=t;customer=JSON.parse(c);if(o)window.lastOnlineOrder=JSON.parse(o);openApp();return}}catch(e){console.error(e)}$('authPage').classList.remove('hidden');$('app').classList.add('hidden')}
window.addEventListener('load',()=>{restore();setTimeout(()=>{if(customer)goHome()},50)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&customer&&$('orderPage').classList.contains('active'))loadProducts()});
</script>
