<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hesbah - الدليفري</title>
<style>
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f6f9;color:#111827}
.wrap{max-width:620px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
h1{margin-top:0}input,button{box-sizing:border-box;width:100%;border:0;border-radius:12px;padding:13px;margin-top:9px;font-size:16px}
input{border:1px solid #d1d5db}.primary{background:#2563eb;color:#fff}.start{background:#16a34a;color:#fff}.stop{background:#dc2626;color:#fff}.done{background:#7c3aed;color:#fff}.secondary{background:#e5e7eb;color:#111827}
.status{padding:13px;border-radius:12px;background:#f3f4f6;margin:10px 0;line-height:1.8}.order{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:10px 0}.order b{display:block;margin-bottom:6px}.muted{color:#6b7280;font-size:13px}.hidden{display:none}.danger{color:#b91c1c}
</style>
<link rel="stylesheet" href="/style.css?v=2026-09-28">
<style>
.driver-chat-modal{position:fixed;inset:0;background:rgba(2,6,23,.65);z-index:100;display:none;align-items:center;justify-content:center;padding:15px}
.driver-chat-modal.show{display:flex}
.driver-chat-card{width:min(560px,100%);height:min(680px,90vh);max-height:calc(100dvh - 30px);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 24px 70px rgba(2,8,23,.25);display:flex;flex-direction:column}
.driver-chat-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#0f172a;color:#fff}
.driver-chat-head button{border:0;background:#334155;color:#fff;border-radius:50%;width:34px;height:34px;font-size:20px}
.driver-chat-messages{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px;background:#f8fafc;display:flex;flex-direction:column;gap:9px}
.driver-chat-msg{max-width:82%;padding:10px 12px;border-radius:16px;line-height:1.55;word-break:break-word}
.driver-chat-msg.driver{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:5px}
.driver-chat-msg.customer{align-self:flex-start;background:#fff;color:#0f172a;border:1px solid #dbe3ee;border-bottom-left-radius:5px}
.driver-chat-msg small{display:block;opacity:.72;font-size:10px;margin-top:4px}
.driver-chat-input{display:grid;grid-template-columns:minmax(0,1fr) 90px;align-items:center;gap:8px;padding:10px;background:#fff;border-top:1px solid #e2e8f0;direction:rtl;flex:0 0 auto}
.driver-chat-input input{display:block;min-width:0;width:100% !important;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:12px;padding:11px 12px;height:46px;margin:0;font-size:16px}
.driver-chat-input button{display:block;width:90px !important;min-width:90px;height:46px;border:0;border-radius:12px;padding:0;margin:0;background:#2563eb;color:#fff;font-weight:900;font-size:16px}
@media(max-width:650px){
  .driver-chat-modal{padding:8px;align-items:flex-start}
  .driver-chat-card{width:100%;height:calc(100dvh - 16px);max-height:calc(100dvh - 16px);margin:0;border-radius:18px}
  .driver-chat-messages{min-height:0}
  .driver-chat-input{position:relative}
  .driver-chat-input input{font-size:15px;height:48px}
  .driver-chat-input{grid-template-columns:minmax(0,1fr) 82px}.driver-chat-input button{width:82px !important;min-width:82px;height:48px}
}
</style></head>
<body>
<div class="wrap">
  <div id="loginCard" class="card">
    <h1>🛵 Hesbah - دخول الدليفري</h1>
    <input id="store" value="demo" placeholder="كود المتجر">
    <input id="username" placeholder="اسم المستخدم">
    <input id="password" type="password" placeholder="كلمة المرور">
    <button class="primary" onclick="driverLogin()">تسجيل الدخول</button>
    <div id="loginMsg" class="status">أدخل بيانات حساب المندوب.</div>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <h1>🛵 لوحة المندوب</h1>
      <div id="driverInfo" class="status"></div>
      <button class="secondary" onclick="loadOrders()">🔄 تحديث الطلبات</button>
      <button class="secondary" onclick="driverLogout()">خروج</button>
    </div>
    <div class="card">
      <h2>طلبات التوصيل</h2>
      <div id="orders"></div>
    </div>
  </div>

  <div id="legacyCard" class="hidden card">
    <h1>📍 رابط تتبع التوصيل</h1>
    <div id="legacyInfo" class="status"></div>
    <button id="legacyStart" class="start hidden" onclick="startLegacy()">▶️ بدء إرسال الموقع</button>
    <button id="legacyStop" class="stop hidden" onclick="stopLegacy()">⏹️ إيقاف إرسال الموقع</button>
  </div>
</div>

<script>
const params=new URLSearchParams(location.search);
const legacyToken=params.get('token')||'';
let token=localStorage.getItem('hesbah_driver_token')||'';
let driver=null;
let watchId=null;
let activeOrderId=null;

const $=id=>document.getElementById(id);
function showApp(){ $('loginCard').classList.add('hidden'); $('app').classList.remove('hidden'); }
function msg(t){$('loginMsg').textContent=t}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

async function driverLogin(){
  try{
    const r=await fetch('/api/public/driver/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      storeId:$('store').value.trim()||'demo',username:$('username').value.trim(),password:$('password').value
    })});
    const d=await r.json();
    if(!r.ok||!d.ok) throw Error(d.message||'تعذر تسجيل الدخول');
    token=d.token;driver=d.driver;localStorage.setItem('hesbah_driver_token',token);
    showApp();renderDriver();loadOrders();startDriverOrderPolling();
  }catch(e){msg(e.message)}
}

function renderDriver(){
  $('driverInfo').innerHTML='مرحباً <b>'+esc(driver?.name||'المندوب')+'</b><br>الهاتف: '+esc(driver?.phone||'-');
}

async function loadOrders(){
  if(!token)return;
  try{
    const r=await fetch('/api/public/driver/orders',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    const d=await r.json();
    if(!r.ok||!d.ok) throw Error(d.message||'تعذر تحميل الطلبات');
    const orders=d.orders||[];
    window.__driverOrders=orders;
    const currentIds=new Set(orders.map(o=>String(o.id)));
    if(driverOrdersInitialized){
      let newCount=0;
      currentIds.forEach(id=>{if(!lastDriverOrderIds.has(id))newCount++});
      if(newCount>0) notifyNewDriverOrders(newCount);
    }else{
      driverOrdersInitialized=true;
    }
    lastDriverOrderIds=currentIds;
    $('orders').innerHTML=orders.length?orders.map(renderOrder).join(''):'<div class="status">لا توجد طلبات مسندة إليك الآن.</div>';
  }catch(e){$('orders').innerHTML='<div class="status danger">'+esc(e.message)+'</div>'}
}


let driverOrdersInitialized=false;
let driverOrdersPolling=null;
let driverOrdersRequestActive=false;
let lastDriverOrderIds=new Set();

function notifyNewDriverOrders(count){
  try{
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    if(AudioContext){
      const ctx=new AudioContext();
      const now=ctx.currentTime;
      [0,0.18,0.36].forEach((offset,i)=>{
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();
        osc.type='sine';
        osc.frequency.value=i===1?880:660;
        gain.gain.setValueAtTime(0.0001,now+offset);
        gain.gain.exponentialRampToValueAtTime(0.18,now+offset+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001,now+offset+0.14);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now+offset);
        osc.stop(now+offset+0.15);
      });
      setTimeout(()=>ctx.close().catch(()=>{}),700);
    }
  }catch(e){}
  const oldTitle=document.title;
  document.title='🔔 طلب جديد للدليفري';
  setTimeout(()=>{document.title=oldTitle},3500);
  if('Notification' in window && Notification.permission==='granted'){
    try{new Notification('Hesbah — طلب جديد',{body:'وصل '+count+' طلب جديد للدليفري.'})}catch(e){}
  }
}

function startDriverOrderPolling(){
  if(driverOrdersPolling) return;
  driverOrdersPolling=setInterval(()=>{
    if(token) loadOrders();
  },3000);
}

function stopDriverOrderPolling(){
  if(driverOrdersPolling){clearInterval(driverOrdersPolling);driverOrdersPolling=null}
}

function renderOrder(o){
  const address=[o.customer?.address,o.customer?.building?'عمارة '+o.customer.building:'',o.customer?.floor?'الدور '+o.customer.floor:'',o.customer?.apartment?'شقة '+o.customer.apartment:''].filter(Boolean).join(' - ');
  const tracking=Number(o.id)===Number(activeOrderId);
  return '<div class="order">'+
    '<b>🧾 '+esc(o.number)+'</b>'+
    '<div>👤 '+esc(o.customer?.name||'')+'</div>'+
    '<div>📞 '+esc(o.customer?.phone||'')+'</div>'+
    '<div>📍 '+esc(address||'العنوان غير مسجل')+'</div>'+
    '<div>💰 '+Number(o.total||0).toFixed(2)+' ج.م</div>'+
    '<div class="muted">الحالة: '+esc(o.status)+'</div>'+
    (o.status==='out_for_delivery'?
      '<button class="start" onclick="startTracking('+Number(o.id)+')">'+(tracking?'📡 التتبع يعمل':'📡 بدء إرسال موقعي')+'</button>'+
      '<button class="done" onclick="completeOrder('+Number(o.id)+')">✅ تم التوصيل</button>'+
      '<button class="secondary" onclick="openDriverChat('+Number(o.id)+')">💬 شات مع العميل</button>'
      :'')+
    (tracking?'<button class="stop" onclick="stopTracking()">⏹️ إيقاف إرسال الموقع</button>':'')+
  '</div>';
}

let gpsErrorShown=false;
function gpsErrorMessage(e){
  if(e?.code===1) return 'تم رفض صلاحية الموقع. افتح إعدادات الموقع في الهاتف، ثم اسمح للمتصفح باستخدام الموقع لهذا الموقع.';
  if(e?.code===2) return 'تعذر تحديد موقع GPS. تأكد أن GPS/الموقع مفتوح وأنك في مكان يمكن للهاتف استقبال الموقع فيه.';
  if(e?.code===3) return 'انتهت مهلة قراءة GPS. اترك الموقع مفتوحاً وحاول مرة أخرى.';
  return e?.message||'تعذر قراءة GPS';
}

function startTracking(orderId){
  if(!navigator.geolocation){alert('هذا الجهاز أو المتصفح لا يدعم GPS');return}
  if(location.protocol!=='https:' && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
    alert('التتبع يحتاج اتصال HTTPS. افتح رابط Hesbah الذي يبدأ بـ https://');
    return;
  }
  activeOrderId=Number(orderId);gpsErrorShown=false;loadOrders();
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);

  navigator.geolocation.getCurrentPosition(
    pos=>sendLocation(pos),
    e=>{
      if(!gpsErrorShown){gpsErrorShown=true;alert('تعذر تشغيل GPS: '+gpsErrorMessage(e))}
      loadOrders();
    },
    {enableHighAccuracy:true,maximumAge:0,timeout:20000}
  );

  watchId=navigator.geolocation.watchPosition(
    sendLocation,
    e=>{
      console.error('GPS watch error',e);
      if(!gpsErrorShown){gpsErrorShown=true;alert('توقف GPS: '+gpsErrorMessage(e))}
    },
    {enableHighAccuracy:true,maximumAge:5000,timeout:20000}
  );
}

async function sendLocation(pos){
  if(!activeOrderId)return;
  const lat=Number(pos?.coords?.latitude),lng=Number(pos?.coords?.longitude);
  if(!Number.isFinite(lat)||!Number.isFinite(lng))return;
  try{
    const r=await fetch('/api/public/driver/location-account',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({
      orderId:activeOrderId,lat,lng,accuracy:Number(pos.coords.accuracy||0)
    }),cache:'no-store'});
    const d=await r.json();
    if(!r.ok||!d.ok) throw Error(d.message||('تعذر إرسال الموقع (HTTP '+r.status+')'));
    console.log('Hesbah GPS sent',d.location);
  }catch(e){
    console.error('send GPS',e);
  }
}

function stopTracking(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
  activeOrderId=null;gpsErrorShown=false;loadOrders();
}

async function completeOrder(orderId){
  if(!confirm('تأكيد أن الطلب تم توصيله للعميل؟'))return;
  try{
    const r=await fetch('/api/public/driver/status-update',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({orderId:Number(orderId)})});
    const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'تعذر إنهاء الطلب');
    if(Number(activeOrderId)===Number(orderId))stopTracking();else loadOrders();
  }catch(e){alert(e.message)}
}

let driverChatOrderId=null;
let driverChatTimer=null;
function formatDriverChatTime(v){try{return new Date(v).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function renderDriverChat(messages){
  const box=$('driverChatMessages');
  if(!box)return;
  if(!messages.length){box.innerHTML='<div style="text-align:center;color:#64748b;padding:30px">لا توجد رسائل بعد.</div>';return}
  box.innerHTML=messages.map(m=>'<div class="driver-chat-msg '+(m.sender==='driver'?'driver':'customer')+'"><b>'+esc(m.sender==='driver'?'أنت':(m.senderName||'العميل'))+'</b><div>'+esc(m.text)+'</div><small>'+esc(formatDriverChatTime(m.createdAt))+'</small></div>').join('');
  box.scrollTop=box.scrollHeight;
}
async function refreshDriverChat(){
  if(!token||!driverChatOrderId)return;
  try{
    const r=await fetch('/api/public/orders/chat?orderId='+encodeURIComponent(driverChatOrderId),{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    const x=await r.json();
    if(r.ok&&x.ok)renderDriverChat(Array.isArray(x.messages)?x.messages:[]);
  }catch(e){console.error('driver chat',e)}
}
function openDriverChat(orderId){
  driverChatOrderId=Number(orderId);
  const order=(window.__driverOrders||[]).find(x=>Number(x.id)===driverChatOrderId);
  $('driverChatOrder').textContent=order?.number?'— '+esc(order.number):'';
  $('driverChatModal').classList.add('show');
  refreshDriverChat();
  if(driverChatTimer)clearInterval(driverChatTimer);
  driverChatTimer=setInterval(refreshDriverChat,3000);
  setTimeout(()=>{$('driverChatInput')?.focus()},100);
}
function closeDriverChat(){
  $('driverChatModal').classList.remove('show');
  if(driverChatTimer){clearInterval(driverChatTimer);driverChatTimer=null}
  driverChatOrderId=null;
}
async function sendDriverChat(){
  const input=$('driverChatInput'),btn=$('driverChatSend');
  if(!input||!driverChatOrderId||!token)return;
  const text=input.value.trim();
  if(!text)return;
  btn.disabled=true;
  try{
    const r=await fetch('/api/public/orders/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({orderId:Number(driverChatOrderId),text})});
    const x=await r.json();
    if(!r.ok||!x.ok)throw Error(x.message||'تعذر إرسال الرسالة');
    input.value='';
    await refreshDriverChat();
  }catch(e){alert(e.message)}
  finally{btn.disabled=false;input.focus()}
}
function driverLogout(){closeDriverChat();stopTracking();stopDriverOrderPolling();localStorage.removeItem('hesbah_driver_token');token='';location.reload()}

async function legacyCheck(){
  if(!legacyToken)return;
  $('loginCard').classList.add('hidden');$('legacyCard').classList.remove('hidden');
  try{
    const r=await fetch('/api/public/driver/status',{headers:{Authorization:'Bearer '+legacyToken}});
    const d=await r.json();
    if(!r.ok||!d.ok)throw Error(d.message||'الرابط غير صالح');
    $('legacyInfo').textContent='الطلب '+d.order.number+' — الحالة: '+d.order.status;
    if(d.order.status==='out_for_delivery')$('legacyStart').classList.remove('hidden');
  }catch(e){$('legacyInfo').textContent=e.message}
}
function startLegacy(){
  if(!navigator.geolocation)return;
  $('legacyStart').classList.add('hidden');$('legacyStop').classList.remove('hidden');
  watchId=navigator.geolocation.watchPosition(async p=>{
    const c=p.coords;
    try{await fetch('/api/public/driver/location',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+legacyToken},body:JSON.stringify({lat:c.latitude,lng:c.longitude,accuracy:c.accuracy})})}catch(e){}
  },e=>{$('legacyInfo').textContent='⚠️ '+e.message},{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}
function stopLegacy(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;$('legacyStop').classList.add('hidden');$('legacyStart').classList.remove('hidden')}

if(legacyToken) legacyCheck();
else if(token){
  fetch('/api/public/driver/orders',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()).then(d=>{
    if(d.ok){showApp();loadOrders();startDriverOrderPolling();}else{localStorage.removeItem('hesbah_driver_token');token=''}
  }).catch(()=>{});
}
</script>

<div id="driverChatModal" class="driver-chat-modal" onclick="if(event.target===this)closeDriverChat()">
  <div class="driver-chat-card">
    <div class="driver-chat-head"><div>💬 شات مع العميل <span id="driverChatOrder"></span></div><button onclick="closeDriverChat()">×</button></div>
    <div id="driverChatMessages" class="driver-chat-messages"><div style="text-align:center;color:#64748b;padding:30px">جاري تحميل المحادثة...</div></div>
    <div class="driver-chat-input"><input id="driverChatInput" maxlength="1000" placeholder="اكتب رسالة للعميل..."><button id="driverChatSend" onclick="sendDriverChat()">إرسال</button></div>
  </div>
</div></body>
</html>
